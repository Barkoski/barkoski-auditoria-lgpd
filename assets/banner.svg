 @keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.beam{animation:swing 7s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-24}}.flow{animation:dash 1.4s linear infinite}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}
</style></defs>
 <rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#dots)"/>
