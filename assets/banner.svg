 <text x="62" y="148" class="serif" font-size="56" font-weight="700" fill="#e9eef7">Auditoria LGPD</text>
 <g class="sans" font-size="22" fill="#a9b6cc"><text x="64" y="196">Código, dados e governança</text><text x="64" y="228">examinados com evidências.</text></g>
